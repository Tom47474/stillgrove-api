spring:
  application:
    name: stillgrove-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  session:
    timeout: 7d
    redis:
      namespace: stillgrove:session

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

mybatis:
  mapper-locations: classpath:mapper/*.xml
