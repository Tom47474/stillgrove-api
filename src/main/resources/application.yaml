spring:
  application:
    name: stillgrove-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  session:
    timeout: 7d
    data:
      redis:
        namespace: stillgrove:session

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

mybatis:
  mapper-locations: classpath:mapper/*.xml

stillgrove:
  cors-origin: ${STILLGROVE_CORS_ORIGIN:http://localhost:5173}
  ai:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${DASHSCOPE_MODEL:qwen-plus}
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:false}
    endpoints: ${ROCKETMQ_ENDPOINTS:localhost:8081}
    topic: ${ROCKETMQ_TOPIC:stillgrove-memory}
    consumer-group: ${ROCKETMQ_CONSUMER_GROUP:stillgrove-memory-worker}
